name: CI
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: checkout driver
        uses: actions/checkout@v6
        with:
          path: ${{ github.workspace }}/driver
      - name: checkout metabase
        uses: actions/checkout@v6
        with:
          repository: metabase/metabase
          path: ${{ github.workspace }}/metabase
          ref: release-x.63.x
      - name: Check postgres jdbc driver version matches metabase
        run: |
          METABASE_TAG=$(grep -oP '(?<=:git/tag ")v[0-9.]+' driver/deps.edn)
          MB_PG=$(curl -s "https://raw.githubusercontent.com/metabase/metabase/${METABASE_TAG}/deps.edn" | grep -oP 'org\.postgresql/postgresql\s+\{:mvn/version "\K[^"]+')
          DRIVER_PG=$(grep -oP 'org\.postgresql/postgresql\s+\{:mvn/version "\K[^"]+' driver/deps.edn)
          echo "metabase ${METABASE_TAG} pins postgres jdbc ${MB_PG}; driver pins ${DRIVER_PG}"
          if [ -z "${MB_PG}" ]; then
            echo "::error::Could not extract postgres jdbc version from metabase ${METABASE_TAG} deps.edn"
            exit 1
          fi
          if [ "${MB_PG}" != "${DRIVER_PG}" ]; then
            echo "::error::Postgres JDBC driver out of sync with metabase ${METABASE_TAG} (metabase: ${MB_PG}, driver: ${DRIVER_PG}). Run: python update-version.py ${METABASE_TAG}"
            exit 1
          fi
      - name: install java
        uses: actions/setup-java@v5
        with:
          distribution: 'adopt'
          java-version: '21'

      - name: Install clojure tools
        uses: DeLaGuardo/setup-clojure@13.6.0
        with:
          cli: 'latest'

      - name: Restore clojure dependencies
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
            ${{ github.workspace }}/metabase/.cpcache
          key: cljdeps-${{ hashFiles('driver/deps.edn', 'metabase/deps.edn') }}
          restore-keys: cljdeps-

      - name: build driver
        run: |
          export DRIVER_PATH=${{ github.workspace }}/driver
          cd ${{ github.workspace }}/metabase
          clojure \
            -Sdeps "{:aliases {:greptimedb {:extra-deps {com.metabase/greptimedb-driver {:local/root \"$DRIVER_PATH\"}}}}}"  \
            -X:build:greptimedb \
            build-drivers.build-driver/build-driver! \
            "{:driver :greptimedb, :project-dir \"$DRIVER_PATH\", :target-dir \"$DRIVER_PATH/target\"}"

      - name: Save clojure dependencies
        if: always()
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
            ${{ github.workspace }}/metabase/.cpcache
          key: cljdeps-${{ hashFiles('driver/deps.edn', 'metabase/deps.edn') }}
